# Release Workflow Dev
#
# This workflow triggers the dev release orchestrator for development and feature branches.
# It creates dev-tagged artifacts and container images for testing.
#
# Triggers:
# - Manual workflow dispatch
#
# Created artifacts:
# - Container images with dev tags
# - See release summary for full details

name: Release Workflow Dev

on:
  workflow_dispatch:

jobs:
  dev-release:
    permissions:
      contents: read # Read code for building
      packages: write # Push dev images to ghcr.io
      actions: read # Dev SBOM job downloads build artifacts via the Actions API
    uses: diggsweden/reusable-ci/.github/workflows/release-dev-orchestrator.yml@v3.0.0-pre # v3 pre-release channel
    with:
      reusable-ci-binary-ref: v3.0.0-pre
      project-type: maven
      # Exercise the full dev SBOM pipeline (build + analyzed-artifact +
      # analyzed-container) on this maven reference repo. r2ps stays on
      # the default `none` for fast feedback.
      sboms: all
      runtime-image: ghcr.io/diggsweden/reusable-ci-runtime-base:v3-pre
      runtime-image-full: ghcr.io/diggsweden/reusable-ci-runtime:v3-pre
      runtime-image-java: ghcr.io/diggsweden/reusable-ci-runtime-java-25:v3-pre
    secrets: inherit
