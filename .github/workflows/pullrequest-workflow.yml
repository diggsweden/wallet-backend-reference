name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "feature/**"

permissions:
  contents: read # Best Security practice. Jobs only get read as base, and then permissions are added as needed

jobs:
  pr-checks:
    uses: diggsweden/reusable-ci/.github/workflows/pullrequest-orchestrator.yml@v3.0.0-pre # v3 pre-release channel
    secrets: inherit # Pass org-level secrets (private Maven deps + CODE_SCANNING_TOKEN for SARIF)
    permissions:
      contents: read # Clone repository and read source code
      packages: read # Access GitHub Packages for Maven dependencies
      security-events: write # Upload nanolinter security findings to the Security tab
    with:
      reusable-ci-binary-ref: v3.0.0-pre
      project-type: maven
      # nanolinter is the default (and only) lint route in v3; no toggles needed.
      runtime-image: ghcr.io/diggsweden/reusable-ci-runtime-base:v3-pre

  test:
    needs: [pr-checks]
    if: always() # Run tests even if linting fails (get complete feedback)
    permissions:
      contents: read # Access test resources and source code
      packages: read # Fetch test dependencies from GitHub Packages
    uses: ./.github/workflows/test.yml
